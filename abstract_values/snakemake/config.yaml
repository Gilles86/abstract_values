# Subjects are auto-discovered from {bids_folder}/sub-*/ses-*/func at
# config-load (see Snakefile). To restrict, set subjects_include (whitelist)
# or subjects_exclude (blacklist) below. Pilot session counts come from
# subject_expected_overrides since they legitimately have only 1 session.
#
# subjects_include: ["08"]              # uncomment to debug a single sub
# subjects_exclude: ["pil01", "pil02"]  # uncomment to drop pilots from cohort runs

# Subjects are considered "complete" once they have this many MRI sessions
# on disk; pipeline aborts at config-load if any subject has fewer.
expected_mri_sessions: 2
subject_expected_overrides:
  pil01: 1
  pil02: 1
# Set to false to bypass the completeness check (e.g. for a debug run on
# an incomplete subject). Default: enforce.
require_complete: true

# Smoothing variants to fit (0 = unsmoothed, 1 = smoothed) — pipeline runs both
smoothed_variants: [0, 1]

# Decoding ROIs: (desc, hemi). hemi == "None" => no hemi entity in filename.
decode_rois:
  - {desc: "BensonV1", hemi: "LR"}
  - {desc: "NPCr",     hemi: "None"}
decode_n_voxels: [0, 50, 100, 250, 500]
decode_lambdas: [0.0, 0.1]

# Expected-decoded-value sweep on aprf-session-shift. nv: top-N or fdrNN
# (whole-brain R²-mixture voxel selection). noise: "spherical" (the
# script default — iid Gaussian residuals) or "residual" (full residual
# Omega). Spherical is preferred — cleaner SD curves, better-conditioned
# on small voxel sets — but residual is kept around for sanity checks.
expected_decoded_rois: ["NPCr"]
expected_decoded_nv:    ["100", "fdr05"]
expected_decoded_noise: ["spherical", "residual"]

# Fisher-information ROIs (Von Mises + aPRF flavors)
fi_rois_vonmises:
  - {desc: "BensonV1", hemi: "LR"}
fi_rois_aprf:
  - {desc: "NPCr", hemi: "None"}

# Cluster paths
bids_folder: "/shares/zne.uzh/gdehol/ds-abstractvalue"
repo_root:   "$HOME/git/abstract_values"
conda_env:   "abstract_values"
fmriprep_deriv: "fmriprep"

# Force BOLD-to-anat coregistration target to T1w. Default fmriprep behavior
# (auto) uses T2w when present, which is unreliable for our cross-session T2w.
bold2anat_init: "t1w"
